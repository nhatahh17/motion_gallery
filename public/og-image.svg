<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Personal Motion Gallery</title>
  <desc id="desc">Minimal off-white preview image with orbiting photo frames.</desc>
  <rect width="1200" height="630" fill="#f8f8f4" />
  <g fill="none" stroke="#101010" stroke-opacity="0.18">
    <ellipse cx="600" cy="315" rx="390" ry="155" stroke-width="3" />
    <ellipse cx="600" cy="315" rx="270" ry="105" stroke-width="2" />
  </g>
  <g fill="#ffffff" stroke="#101010" stroke-opacity="0.55" stroke-width="3">
    <rect x="285" y="243" width="154" height="104" rx="8" />
    <rect x="502" y="195" width="196" height="132" rx="8" />
    <rect x="765" y="266" width="150" height="196" rx="8" />
  </g>
  <g fill="#101010">
    <text x="90" y="104" font-family="Inter, Arial, sans-serif" font-size="28" letter-spacing="0">Personal Motion Gallery</text>
    <text x="90" y="542" font-family="Inter, Arial, sans-serif" font-size="54" letter-spacing="0">Experimental WebGL photo gallery</text>
    <text x="92" y="584" font-family="Inter, Arial, sans-serif" font-size="24" fill-opacity="0.58" letter-spacing="0">2D Circle / 3D Circle / 3D Horizon</text>
  </g>
</svg>
